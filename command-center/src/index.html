<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<meta name="theme-color" content="#07060b">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header id="topbar">
  <input id="search" type="search" placeholder="Search" aria-label="Search">
  <button id="shift-toggle" type="button" class="topbtn" aria-pressed="false">⚡ Day off</button>
  <button id="theme-toggle" type="button" class="topbtn" aria-label="Switch to light theme">☾</button>
</header>
<main id="view" tabindex="-1"></main>
<nav id="tabs" aria-label="Sections"></nav>
<button id="fab" type="button" aria-label="Quick add">+</button>
<dialog id="quickadd" aria-label="Quick add"></dialog>
<dialog id="ask" aria-label="Ask Claude"></dialog>
<script type="module" src="./main.js"></script>
</body>
</html>
